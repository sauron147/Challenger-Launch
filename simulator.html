<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>직업 추천 & 양대 공식 비교 시뮬레이터</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #11151e;
      color: #e2e8f0;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      border: 1px solid #2d3748;
      overflow: hidden;
      user-select: none;
    }

    .chat-titlebar {
      -webkit-app-region: drag;
      height: 32px;
      background: linear-gradient(180deg, #242b38 0%, #171c26 100%);
      border-bottom: 1px solid #2d3748;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      flex-shrink: 0;
    }
    .title-left {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: bold;
      color: #fbd38d;
      letter-spacing: 0.3px;
    }
    .title-controls {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .bar-btn {
      background: #1a202c;
      border: 1px solid #4a5568;
      color: #cbd5e0;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 10px;
      cursor: pointer;
    }
    .bar-btn:hover { border-color: #63b3ed; color: #fff; }
    .bar-btn.active-snap {
      background: rgba(72, 187, 120, 0.2);
      border-color: #48bb78;
      color: #68d391;
      font-weight: bold;
    }
    .bar-btn.active-pin {
      background: rgba(237, 137, 54, 0.25);
      border-color: #ed8936;
      color: #fbd38d;
    }

    .chat-tab-bar {
      display: flex;
      background: #171c26;
      border-bottom: 1px solid #2d3748;
      padding: 4px 8px 0 8px;
      gap: 4px;
      flex-shrink: 0;
    }
    .chat-tab {
      background: #1f2735;
      color: #a0aec0;
      border: 1px solid #2d3748;
      border-bottom: none;
      border-radius: 5px 5px 0 0;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }
    .chat-tab.active {
      background: #11151e;
      color: #fff;
      border-top: 2px solid #f6ad55;
    }

    .filter-panel {
      background: #161b26;
      border-bottom: 1px solid #2d3748;
      padding: 7px 9px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-shrink: 0;
    }
    .spec-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }
    .spec-grid-2 {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 5px;
    }
    .spec-box {
      background: #11151e;
      border: 1px solid #2d3748;
      border-radius: 4px;
      padding: 4px 6px;
    }
    .spec-box label {
      display: block;
      font-size: 10px;
      color: #a0aec0;
      margin-bottom: 2px;
    }
    .spec-box input, .spec-box select {
      width: 100%;
      background: #1a202c;
      border: 1px solid #4a5568;
      color: #fff;
      border-radius: 3px;
      padding: 2px 4px;
      font-size: 11px;
      font-weight: bold;
    }

    /* 정렬 드롭다운 내부 항목별 글씨 색상 구분 */
    #simSortSelect option {
      background-color: #141923;
      font-weight: bold;
      padding: 4px;
    }
    #simSortSelect option.opt-green {
      color: #4ade80; /* 초록색: 환산 주스탯(헥환 11만 Q3) 기준 */
    }
    #simSortSelect option.opt-blue {
      color: #60a5fa; /* 파란색: 내 역산 데미지 공식(히어로 819.5) 기준 */
    }
    #simSortSelect option.opt-diff {
      color: #c084fc; /* 보라색: 두 공식 편차 비교 */
    }
    #simSortSelect option.opt-normal {
      color: #e2e8f0;
    }

    .frag-quick-row {
      display: flex;
      gap: 4px;
    }
    .frag-chip {
      flex: 1;
      background: #1a202c;
      border: 1px solid #2d3748;
      color: #cbd5e0;
      border-radius: 3px;
      padding: 2px 2px;
      font-size: 10px;
      cursor: pointer;
      text-align: center;
    }
    .frag-chip:hover, .frag-chip.active {
      background: #2b6cb0;
      border-color: #63b3ed;
      color: #fff;
      font-weight: bold;
    }

    .formula-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #11151e;
      border: 1px solid #2d3748;
      border-radius: 4px;
      padding: 4px 7px;
      font-size: 10px;
      color: #cbd5e0;
    }
    .formula-bar label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .result-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 7px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .job-sim-card {
      background: #181e2c;
      border: 1px solid #2d3748;
      border-left: 3px solid #4a5568;
      border-radius: 5px;
      padding: 7px 9px;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease;
    }
    .job-sim-card:hover {
      background: #20293d;
      border-color: #63b3ed;
    }
    .job-sim-card.burst-card { border-left-color: #fc8181; }
    .job-sim-card.sustained-card { border-left-color: #63b3ed; }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    .job-title-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .rank-num {
      background: #2d3748;
      color: #fbd38d;
      font-size: 10px;
      font-weight: bold;
      padding: 1px 5px;
      border-radius: 3px;
    }
    .job-name {
      font-size: 13px;
      font-weight: bold;
      color: #fff;
    }

    /* 초록색(표준체급 기준) vs 파란색(내 역산 데미지 공식) 비교 박스 */
    .formula-compare-box {
      background: #121722;
      border: 1px solid #283142;
      border-radius: 4px;
      padding: 5px 7px;
      margin-bottom: 5px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .formula-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      padding: 1px 3px;
      border-radius: 3px;
    }
    .formula-row.active-formula-row {
      background: rgba(255, 255, 255, 0.05);
    }
    /* 초록색: 환산 주스탯 헥환 11만 체급 기준 */
    .text-green-formula {
      color: #4ade80;
      font-weight: bold;
    }
    /* 파란색: 내 역산 데미지 공식 (히어로 819.5 & 전투력 효율) 기준 */
    .text-blue-formula {
      color: #60a5fa;
      font-weight: bold;
    }
    .formula-diff-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      border-top: 1px dashed #2d3748;
      padding-top: 3px;
      margin-top: 1px;
      color: #a0aec0;
    }

    .card-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      font-size: 10px;
    }
    .util-badge {
      padding: 1px 6px;
      border-radius: 3px;
      background: #11151e;
      border: 1px solid #2d3748;
      color: #a0aec0;
    }
    .util-badge.iframe-ok {
      color: #fbd38d;
      border-color: rgba(246, 173, 85, 0.4);
      background: rgba(237, 137, 54, 0.12);
    }
    .util-badge.cdr-badge {
      color: #d6bcfa;
      border-color: rgba(183, 148, 244, 0.45);
      background: rgba(128, 90, 213, 0.15);
      font-weight: bold;
    }
    .util-badge.cast-badge {
      color: #90cdf4;
      border-color: rgba(99, 179, 237, 0.35);
    }
    .util-badge.bind-ok {
      color: #9ae6b4;
      border-color: rgba(72, 187, 120, 0.4);
    }

    .sim-footer {
      background: #151922;
      border-top: 1px solid #2d3748;
      padding: 5px 10px;
      font-size: 10px;
      color: #718096;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header class="chat-titlebar">
    <div class="title-left">
      <span>🍁 MAPLESTORY SIMULATOR (초록:표준체급(Q3) vs 파랑:역산공식)</span>
    </div>
    <div class="title-controls">
      <button id="snapStateBtn" class="bar-btn active-snap" type="button" title="클릭 시 메인 창 우측에 자석 부착">🧲 자석 붙음</button>
      <button id="alwaysOnTopBtn" class="bar-btn" type="button" title="항상 위에 고정">📌 항상 위</button>
      <button id="minWinBtn" class="bar-btn" type="button">_</button>
      <button id="closeWinBtn" class="bar-btn" type="button">✕</button>
    </div>
  </header>

  <nav class="chat-tab-bar">
    <button id="tabSimResult" class="chat-tab active" type="button">🏆 양대 공식 비교 & 직업 추천</button>
    <button id="tabUtilEdit" class="chat-tab" type="button">🛡️ 쿨뚝 유효율 & 무적 DB</button>
  </nav>

  <!-- [뷰 1] 메인 시뮬레이터 뷰 -->
  <div id="simResultView" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
    <section class="filter-panel">
      <div class="spec-grid">
        <div class="spec-box">
          <label>입장 전투력 (만 단위)</label>
          <input type="number" id="simCpManInput" value="10650" step="100" />
          <span id="simCpKoreanText" style="font-size: 9px; color: #63b3ed;">1억 650만</span>
        </div>
        <div class="spec-box">
          <label>6차 조각 사용량</label>
          <input type="number" id="simFragInput" value="5656" step="100" min="0" max="45000" />
          <span style="font-size: 9px; color: #f6ad55;">직업별 헥환 자동보정</span>
        </div>
        <div class="spec-box">
          <label>목표 보스 체력 (조)</label>
          <input type="number" id="simBossHpJoInput" value="779" step="10" />
          <span style="font-size: 9px; color: #fc8181;">포스 132% · 실전 70%</span>
        </div>
      </div>

      <div class="frag-quick-row">
        <button type="button" class="frag-chip" data-frag="0">0조각</button>
        <button type="button" class="frag-chip" data-frag="2000">2천개</button>
        <button type="button" class="frag-chip active" data-frag="5656">본캐(5656)</button>
        <button type="button" class="frag-chip" data-frag="10000">1만개</button>
        <button type="button" class="frag-chip" data-frag="20000">2만개</button>
        <button type="button" class="frag-chip" data-frag="40000">4만(풀강)</button>
      </div>

      <!-- 쿨타임 감소 모자(쿨뚝) 설정 행 -->
      <div class="spec-grid-2">
        <div class="spec-box">
          <label>🎩 착용 모자 (쿨뚝 초수 설정)</label>
          <select id="simCoolHatSelect">
            <option value="REC" selected>직업별 연무장 표준뚝 (권장 자동)</option>
            <option value="0">스탯뚝 착용 (쿨감 0초 고정)</option>
            <option value="1">1초뚝 착용 (쿨감 -1초)</option>
            <option value="2">2초뚝 착용 (쿨감 -2초)</option>
            <option value="3">3초뚝 착용 (쿨감 -3초)</option>
            <option value="4">4초뚝 착용 (쿨감 -4초)</option>
            <option value="5">5초뚝 착용 (쿨감 -5초)</option>
            <option value="6">6초뚝 착용 (쿨감 -6초)</option>
          </select>
        </div>
        <div class="spec-box">
          <label>⚖️ 쿨뚝 딜 가중치 방식</label>
          <select id="simCdrWeightMode">
            <option value="PURE_GAIN" selected>순수 쿨감 회전 딜상승치 반영</option>
            <option value="NET_STAT_COST">스탯뚝 기회비용(-주스탯%) 차감</option>
          </select>
        </div>
      </div>

      <!-- 딜 구조 / 무적기 / 정렬 (초록색 & 파란색 구분) -->
      <div class="spec-grid">
        <div class="spec-box">
          <label>⚡ 딜 구조 (660ms 보정)</label>
          <select id="simRoleFilter">
            <option value="ALL">전체 (극딜+평딜)</option>
            <option value="BURST">🔥 극딜 직업 (50%↑)</option>
            <option value="SUSTAINED">🔄 평딜 직업 (50%↓)</option>
          </select>
        </div>
        <div class="spec-box">
          <label>🛡️ 무적기 쿨타임</label>
          <select id="simIframeFilter">
            <option value="ALL">무적기 무관 (전체)</option>
            <option value="HAS_IFRAME">무적기 보유 필수</option>
            <option value="30">쿨 30초 이하</option>
            <option value="45">쿨 45초 이하</option>
            <option value="60">쿨 60초 이하</option>
            <option value="90">쿨 90초 이하</option>
          </select>
        </div>
        <div class="spec-box" style="grid-column: span 1;">
          <label>📊 정렬 기준 (초록 vs 파랑)</label>
          <select id="simSortSelect" style="color: #4ade80; border-color: #4ade80;">
            <option value="DPS_STD_DESC" class="opt-green" selected>🟢 [환산주스탯] 헥환11만 체급 딜량순</option>
            <option value="DPS_EFF_DESC" class="opt-blue">🔵 [내 역산공식] 히어로·전투력 역산순</option>
            <option value="FORMULA_DIFF_DESC" class="opt-diff">⚖️ [공식비교] 역산 vs 표준체급 격차 큰순</option>
            <option value="CDR_EFF_DESC" class="opt-normal">🎩 4초뚝 유효율(딜상승) 높은순</option>
            <option value="BURST_DESC" class="opt-normal">🔥 660ms 보정 극딜 비중순</option>
            <option value="ACT_ASC" class="opt-normal">⌨️ 실효 조작(사출기제외) 적은순</option>
            <option value="ACT_DESC" class="opt-normal">⌨️ 실효 조작(사출기제외) 많은순</option>
            <option value="IFRAME_ASC" class="opt-normal">🛡️ 무적기 쿨타임 짧은순</option>
          </select>
        </div>
      </div>

      <!-- 660ms 표준 액션 딜레이 수식 체크 바 -->
      <div class="formula-bar">
        <label title="체크 시 사출기/파이널어택 타수를 제외하고 키다운을 660ms 표준 액션으로 환산합니다.">
          <input type="checkbox" id="chkFilterProc660" checked />
          <span>⌨️ 사출기 제거 & 660ms 정규화</span>
        </label>
        <label title="체크 시 660ms 주력기를 꾹 누를 때의 평딜 기저치를 극딜 구간에서 차감합니다.">
          <input type="checkbox" id="chkBase660Burst" checked />
          <span>⚡ 660ms 기저평딜 차감</span>
        </label>
      </div>
    </section>

    <div id="simCardsContainer" class="result-scroll-area"></div>
  </div>

  <!-- [뷰 2] 쿨뚝 유효율 & 무적기 커스텀 편집 뷰 -->
  <div id="utilEditView" class="result-scroll-area hidden">
    <div style="font-size: 11px; color: #a0aec0; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center;">
      <span>💡 직업별 쿨뚝 유효 스킬 비중(%)과 무적기 쿨타임(초)을 커스텀 조정할 수 있습니다.</span>
      <button id="resetUtilDbBtn" class="bar-btn" type="button">기본값 복원</button>
    </div>
    <div id="utilEditListContainer" style="display: flex; flex-direction: column; gap: 6px;"></div>
  </div>

  <footer class="sim-footer">
    <span id="simCountStatus">조건 부합: 0개 직업</span>
    <span><b style="color:#4ade80;">●초록:표준체급(Q3)</b> · <b style="color:#60a5fa;">●파랑:내 역산공식</b></span>
  </footer>

  <script src="./simulator.js"></script>
</body>
</html>
